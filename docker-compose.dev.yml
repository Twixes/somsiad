version: "3.8"
volumes:
  web_panel_node_modules:
services:
  postgres:
    environment:
      POSTGRES_DB: somsiad
      POSTGRES_PASSWORD: somsiad
      POSTGRES_USER: somsiad
      POSTGRES_EXTENSIONS: pg_trgm
    build:
      context: .
      dockerfile: postgres.Dockerfile
    ports:
      - "5437:5432"
  clickhouse:
    build:
      context: .
      dockerfile: clickhouse/Dockerfile
    environment:
      CLICKHOUSE_DB: somsiad
      CLICKHOUSE_USER: somsiad
      CLICKHOUSE_PASSWORD: somsiad
  redis:
    image: redis:alpine
  bot:
    build: .
    command: ["python", "-m", "jurigged", "run.py"]
    volumes:
      - ./:/code/
    restart: on-failure
    stop_grace_period: 20s
    depends_on:
      - postgres
      - clickhouse
      - redis
    links:
      - postgres:postgres
      - clickhouse:clickhouse
      - redis:redis
    environment:
      - DISCORD_TOKEN
      - COMMAND_PREFIX
      - COMMAND_COOLDOWN_PER_USER_IN_SECONDS
      - GOOGLE_KEY
      - GOOGLE_CUSTOM_SEARCH_ENGINE_ID
      - GOODREADS_KEY
      - TMDB_KEY
      - LAST_FM_KEY
      - WOLFRAM_ALPHA_APP_ID
      - DISCO_MAX_FILE_SIZE_IN_MIB
      - SENTRY_DSN
      - SENTRY_AUTH_TOKEN
      - SENTRY_ORG
      - OPENAI_API_KEY
      - PTVSD
      - DATABASE_URL=postgresql://somsiad:somsiad@postgres/somsiad
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_USER=somsiad
      - CLICKHOUSE_PASSWORD=somsiad
      - CLICKHOUSE_DATABASE
      - POSTHOG_API_KEY
      - POSTHOG_HOST
      - REDIS_URL=redis://redis:6379/
  web:
    build: web
    depends_on:
      - redis
      - postgres
    links:
      - redis:redis
      - postgres:postgres
    environment:
      - REDIS_URL=redis://redis:6379/
      - DATABASE_URL=postgresql://somsiad:somsiad@postgres/somsiad
      - DISCORD_TOKEN
      - DISCORD_CLIENT_SECRET
      - DISCORD_REDIRECT_URI=http://localhost/panel/callback
      - SECRET_KEY
    labels:
      - traefik.enable=true
      - traefik.http.services.web-app.loadbalancer.server.port=5000
      - traefik.http.routers.web-dev-flask-panel.rule=Host(`localhost`) && (PathPrefix(`/panel/api`) || Path(`/panel/callback`) || Path(`/panel/auth`) || Path(`/panel/login`))
      - traefik.http.routers.web-dev-flask-panel.priority=100
      - traefik.http.routers.web-dev-flask-panel.service=web-app
      - traefik.http.routers.web-dev-flask-panel.entrypoints=web
      - traefik.http.routers.web-dev-main.rule=Host(`localhost`)
      - traefik.http.routers.web-dev-main.priority=1
      - traefik.http.routers.web-dev-main.service=web-app
      - traefik.http.routers.web-dev-main.entrypoints=web
    volumes:
      - ./web/:/code/
  web-panel:
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-c", "npm install && npm run dev"]
    volumes:
      - ./web/panel:/app
      - web_panel_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      - POSTHOG_API_KEY
      - POSTHOG_HOST
    labels:
      - traefik.enable=true
      - traefik.http.services.web-panel-vite.loadbalancer.server.port=5173
      - traefik.http.routers.web-dev-vite.rule=Host(`localhost`) && PathPrefix(`/panel`)
      - traefik.http.routers.web-dev-vite.priority=50
      - traefik.http.routers.web-dev-vite.service=web-panel-vite
      - traefik.http.routers.web-dev-vite.entrypoints=web
  router:
    image: "traefik:v2.4"
    depends_on:
      - web
      - web-panel
    command:
      - --entrypoints.web.address=:80
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --api.insecure
    ports:
      - "80:80"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
